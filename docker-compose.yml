# ============================================
# AskVault — Local Development Stack
# docker-compose up -d
# ============================================

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: askvault-postgres
    environment:
      POSTGRES_DB: askvault
      POSTGRES_USER: askvault
      POSTGRES_PASSWORD: askvault_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askvault"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database browsing
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: askvault-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@askvault.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  pgdata:
