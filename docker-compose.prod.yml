# ============================================
# AskVault — Production Docker Compose
# Usage: docker-compose -f docker-compose.prod.yml up -d
# ============================================

version: "3.9"

services:
  # ---- PostgreSQL + pgvector ----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: askvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-askvault}
      POSTGRES_USER: ${POSTGRES_USER:-askvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"  # Only expose to localhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askvault}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Next.js App ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: askvault-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-askvault}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-askvault}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Required}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?Required}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Required}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Required}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://yourdomain.com/api/google/callback}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://yourdomain.com}
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---- Job Worker ----
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: askvault-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-askvault}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-askvault}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  pgdata:
    driver: local

networks:
  default:
    name: askvault-network
